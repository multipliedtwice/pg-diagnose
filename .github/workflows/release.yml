name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be X.Y.Z (got: $v)" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${v}" >/dev/null 2>&1; then
            echo "tag v${v} already exists — nothing to release"
            exit 0
          fi
          bash build.sh
          bash -n dist/pg-diagnose.sh
          gh release create "v${v}" dist/pg-diagnose.sh \
            --target "$GITHUB_SHA" \
            --title "v${v}" \
            --notes "pg-diagnose v${v} — single-file bundle built from src/ at ${GITHUB_SHA}"