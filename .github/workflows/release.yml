name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: bash -n dist/pg-diagnose.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/pg-diagnose.sh